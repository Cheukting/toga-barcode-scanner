[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toga-barcode-scanner"
version = "0.1.1"
description = "A native camera barcode and QR code scanner hardware plugin for the BeeWare Toga ecosystem."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "SodaTry Team", email = "dev@sodatry.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]
dependencies = [
    "toga-core>=0.4.0",
]

[project.optional-dependencies]
ios = [
    "rubicon-objc>=0.4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "build>=1.6.1",
    "twine>=7.0.0",
]
